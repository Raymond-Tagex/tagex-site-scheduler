<!--
  Drives the REAL mod-scheduler.js ticket intake in a REAL browser, against a stubbed network.

      node scripts/ui-harness.js   then   http://localhost:4321/test/ticket-harness.html

  IT USES THE REAL MARKUP. The page fetches /index.html and lifts #schedApp out of it rather
  than keeping its own copy of the form. A harness with a private copy of the markup passes
  happily while the real page is broken — which is exactly what happened to the delivery app's
  job card harness, where a field had been renamed in index.html and the harness never noticed.

  What it proves is the part source-reading cannot: that a tap reaches the dispatcher, that the
  fields actually sent to Airtable are the right ones under the right field ids, that the
  reference is read back off the created record, and that a half-failed save says so.

  The page title ends in PASS or FAIL; window.__result says the same.
-->

function stubTX() {
  TX.me = () => ({ user:{ email:'raymond@tagexenergy.co.za', fullName:'Raymond' },
                   role:{ name:'Admin / Director' } });
  TX.can = () => true;
  TX.canField = () => true;
  TX.userEmail = () => 'raymond@tagexenergy.co.za';

  TX.api = async (q) => {
    if (q.op === 'get' && q.table === 'tickets' && q.sub === 'ticket') {
      // Before the read, not after: this is the reads-only branch, and the guard further down
      // never saw a ticket get because this returned first.
      if (window.FAIL_GET === q.recordId) throw new Error('the ticket could not be read');
      return { records: TICKETS.filter((r) => r.id === q.recordId) };
    }
    if (q.op === 'list' || q.op === 'get') {
      if (q.table === 'job_cards') return { records: JOBCARDS };
      if (q.table === 'activity_log') return { records: ACTS };
      if (q.table === 'tickets' && q.sub === 'ticket') return { records: TICKETS };
      if (q.table === 'tickets' && q.sub === 'spares') {
        if (window.FAIL_ON === 'tickets:spares:read') throw new Error('stubbed spares read failure');
        return { records: SPARES.map((r) => (window.SPARE_VISITS[r.id]
          ? { ...r, fields: { ...r.fields, fldkd9aIylu0lRM6S: window.SPARE_VISITS[r.id] } }
          : r)) };
      }
      if (q.table === 'stock_items') {
        if (window.FAIL_ON === 'stock:read') throw new Error('stubbed catalogue failure');
        return { records: STOCK_ROWS };
      }
      if (q.table === 'people') return { records: PEOPLE };
      if (q.table === 'site_visits') return { records: VISITS };
      return { records: [] };
    }
    const key = q.table + (q.sub ? ':' + q.sub : '');
    window.SENT.push({ op:q.op, table:key, fields:q.fields, recordId:q.recordId });
    if (key === 'tickets:spares' && q.op === 'update' && q.fields
        && q.fields.fldkd9aIylu0lRM6S) {
      window.SPARE_VISITS[q.recordId] = q.fields.fldkd9aIylu0lRM6S;
    }
    if (window.FAIL_ON === key) throw new Error('stubbed failure on ' + key);
    if (key === 'tickets:ticket' && q.op === 'create') {
      seq += 1;
      return { records:[{ id:'recTKT' + seq, createdTime:new Date().toISOString(),
        fields: Object.assign({}, q.fields, { [FID.ref]:'TKT-2026-' + String(seq).padStart(4,'0') }) }] };
    }
    // Without this the app read back a stub record with the wrong id, and DATA.visits was
    // left holding it -- so the next assertion measured the stub, not the app.
    // Without this a second pull saw the same loose entries and linked them again, so the
    // "and not twice" assertions passed against a stub rather than against the app.
    if (q.table === 'activity_log' && q.op === 'update' && window.FAIL_ACT_UPDATE) {
      throw new Error(window.FAIL_ACT_UPDATE);
    }
    if (q.table === 'activity_log' && q.op === 'update') {
      const a = ACTS.find((r) => r.id === q.recordId);
      if (a) {
        Object.assign(a.fields, q.fields);
        return { records:[{ id:a.id, fields:{ ...a.fields } }] };
      }
    }
    if (q.table === 'site_visits' && q.op === 'update') {
      const v = VISITS.find((r) => r.id === q.recordId);
      if (v) {
        Object.assign(v.fields, q.fields);
        return { records:[{ id:v.id, fields:{ ...v.fields } }] };
      }
    }
    if (q.table === 'site_visits' && q.op === 'get') {
      const v = VISITS.find((r) => r.id === q.recordId);
      if (v) return { records:[{ id:v.id, fields:{ ...v.fields } }] };
    }
    if (q.table === 'site_visits' && q.op === 'create') {
      return { records:[{ id:'recNEWVISIT', fields:q.fields }] };
    }
    return { records:[{ id:'recNEW', fields:q.fields || {} }] };
  };
  TX.list = (base, table, params, extra = {}) => TX.api({ op:'list', base, table, params:params||{}, ...extra });
  TX.get = (base, table, recordId, extra = {}) => TX.api({ op:'get', base, table, recordId, ...extra });
}

// ── boot: real markup, real module ──────────────────────────────────────────
async function boot() {
  const html = await fetch('/index.html', { cache:'no-store' }).then((r) => r.text());
  const doc = new DOMParser().parseFromString(html, 'text/html');
  // #modScheduler, not #schedApp. Every scheduler rule in the stylesheet is scoped under
  // .mod-scheduler, and overlayHost() puts the visit modal inside #modScheduler -- so lifting
  // the inner element alone gives an unstyled page and a modal parked outside the scope,
  // which is how a 44px tap target measured zero here while being fine in the app.
  const app = doc.getElementById('modScheduler');
  if (!app) throw new Error('#modScheduler is not in index.html any more');
  const host = document.importNode(app, true);
  host.hidden = false;
  host.style.display = 'block';
  document.getElementById('stage').appendChild(host);
  if (!document.getElementById('schedApp')) throw new Error('#schedApp is not inside #modScheduler');
  // pick.js scans on DOMContentLoaded, which was over before this markup existed. The real
  // page needs no equivalent: #om-jcsel is in index.html from the start.
  TX.pick.scan();

  stubTX();
  // Evaluated rather than <script src>, so the driver can hand this frame a mutated copy.
  // eslint-disable-next-line no-new-func
  new Function(window.__SRC)();
  await TX.scheduler.start();
  TX.scheduler.stop();          // kill the auto-refresh timer; nothing here needs it
  // switchTab('omtickets') is what runs omLoadAll(), which is what fills the job card
  // dropdown. scheduler.start() only loads the calendar side.
  const tab = document.querySelector('[data-tab="omtickets"]');
  if (!tab) throw new Error('no O&M tab button in the markup');
  tab.dispatchEvent(new MouseEvent('click', { bubbles: true }));
  await tick(); await tick();
  const nav = document.getElementById('ombn-new');
  if (nav) nav.dispatchEvent(new MouseEvent('click', { bubbles: true }));
  await tick();
}

  // recJC1 carries three loose entries, one that belongs to another ticket, and the entries

  // history, which is why taking the lot is the wrong answer.
  await backToTkt('TKT-2026-0009');
  const pullBtn = () => d().querySelector('[data-act="omTktPullHistory"]');
  t('the ticket offers to pull its job card history', !!pullBtn(), true);

  window.SENT = [];
  pullBtn().dispatchEvent(new MouseEvent('click', { bubbles:true }));
  await settle(30);

  const boxes = () => [...d().querySelectorAll('#om-pulllist input[type="checkbox"]')];
  t('it offers the loose entries rather than taking them',
    boxes().map((b) => b.value).sort(), ['recH1', 'recH2', 'recH3']);
  t('and writes nothing on opening',
    window.SENT.filter((x) => x.op === 'update' && x.table === 'activity_log').length, 0);
  t('nothing is ticked to begin with', boxes().some((b) => b.checked), false);
  t('an entry belonging to another ticket is not offered',
    boxes().some((b) => b.value === 'recH4'), false);
  t('nor is one from a different job card',
    boxes().some((b) => b.value === 'recH5'), false);
  // The dates and the notes are what tell one entry from another.
  t('each row says when it was and what it said',
    /PV therm removed/.test(d().querySelector('#om-pulllist').textContent), true);
  // recH4 is on another ticket. Saying so is how somebody knows the list is short on purpose
  // rather than short because something went wrong.
  t('and says that one belongs to another ticket and cannot be picked',
    /\d+ belongs? to another ticket and cannot be picked/.test(d().querySelector('#om-pullbox').textContent), true);

  log('\nNOTHING HAPPENS UNTIL SOMETHING IS CHOSEN');
  d().querySelector('[data-act="omPullApply"]').dispatchEvent(new MouseEvent('click', { bubbles:true }));
  await settle(20);
  t('pressing it with nothing ticked writes nothing',
    window.SENT.filter((x) => x.op === 'update' && x.table === 'activity_log').length, 0);
  t('and says so rather than going quiet',
    /nothing chosen yet/.test(d().querySelector('#om-pullcount').textContent), true);

  log('\nONLY WHAT WAS TICKED IS LINKED');
  // tickBox, not tick: the harness already has a tick() that pumps the event loop.
  const tickBox = (v) => {
    const b = boxes().find((x) => x.value === v);
    b.checked = true;
    b.dispatchEvent(new Event('change', { bubbles:true }));
  };
  tickBox('recH1');
  tickBox('recH3');
  t('the count follows what is ticked',
    /2 of 3 chosen/.test(d().querySelector('#om-pullcount').textContent), true);

  window.SENT = [];
  d().querySelector('[data-act="omPullApply"]').dispatchEvent(new MouseEvent('click', { bubbles:true }));
  await settle(60);

  const linked = window.SENT.filter((x) => x.op === 'update' && x.table === 'activity_log');
  t('the two chosen entries are linked', linked.map((x) => x.recordId).sort(), ['recH1', 'recH3']);
  t('and the one left unticked is not', linked.some((x) => x.recordId === 'recH2'), false);
  t('each onto this ticket',
    linked.every((x) => JSON.stringify(x.fields[FID.alTicket]) === '["recTKTc"]'), true);
  // The entry belongs to the job card as well; the card's own history must not lose it.
  t('and none of them has its job card taken away',
    linked.some((x) => Object.prototype.hasOwnProperty.call(x.fields, FID.alJc)), false);

  const said = window.SENT.find((x) => x.op === 'create' && x.table === 'activity_log');
  t('the pull itself is written down', !!said, true);
  t('saying how many, and that a person chose them',
    /2 earlier job card entries pulled onto this ticket, chosen by hand/.test(said.fields[FID.alNote]), true);
  t('linked to the ticket and its job card',
    [said.fields[FID.alTicket], said.fields[FID.alJc]], [['recTKTc'], ['recJC1']]);

  log('\nWHAT IS LEFT IS STILL ON OFFER');
  pullBtn().dispatchEvent(new MouseEvent('click', { bubbles:true }));
  await settle(30);
  t('the entry that was not chosen can still be picked later',
    boxes().map((b) => b.value), ['recH2']);
  // Select all and Clear are the only shortcuts; neither writes anything on its own.
  window.SENT = [];
  d().querySelector('[data-act="omPullAll"]').dispatchEvent(new MouseEvent('click', { bubbles:true }));
  t('select all ticks everything on offer', boxes().every((b) => b.checked), true);
  d().querySelector('[data-act="omPullNone"]').dispatchEvent(new MouseEvent('click', { bubbles:true }));
  t('and clear unticks it again', boxes().some((b) => b.checked), false);
  t('neither writes anything by itself', window.SENT.length, 0);
  d().querySelector('[data-act="omPullCancel"]').dispatchEvent(new MouseEvent('click', { bubbles:true }));
  t('cancel puts the picker away', !!d().querySelector('#om-pullbox'), false);

  log('\nWHEN THERE IS NOTHING LEFT AT ALL');
  // recH2 is the last loose one; take it and the offer becomes a sentence, not a list.
  pullBtn().dispatchEvent(new MouseEvent('click', { bubbles:true }));
  await settle(30);
  boxes().forEach((b) => { b.checked = true; });
  d().querySelector('[data-act="omPullApply"]').dispatchEvent(new MouseEvent('click', { bubbles:true }));
  await settle(60);
  window.SENT = [];
  pullBtn().dispatchEvent(new MouseEvent('click', { bubbles:true }));
  await settle(30);
  t('no picker is offered', !!d().querySelector('#om-pullbox'), false);
  t('and nothing is written', window.SENT.length, 0);
  // Writing nothing is also what a button that silently gave up would do. The message is the
  // only thing that tells the two apart -- and an earlier version of this did give up, because
  // its own first run had emptied the ticket cache.
  t('it says why instead',
    /already on this ticket/.test(d().querySelector('#om-tktmsg').textContent), true);
  t('and does not claim it could not read the ticket',
    /could not be read/.test(d().querySelector('#om-tktmsg').textContent), false);

  log('\nA REFUSAL SAYS WHAT REFUSED IT');
  // Admin / Director has activity_log edit = false on the live base, so every entry came back
  // refused and the screen said "3 did not link. Try again." -- which named nothing and asked
  // for the one thing that could not work.
  // TKT-2026-0006, not 0007: 0007 is on recJC1, whose loose entries the section above has
  // already taken, so the picker there is a sentence rather than a list and every assertion
  // below it skipped without saying so. recJC2 still has one.
  await backToTkt('TKT-2026-0006');
  const pull6 = d().querySelector('[data-act="omTktPullHistory"]');
  t('the button is there to press', !!pull6, true);
  window.FAIL_ACT_UPDATE = 'Your role may not edit the activity log.';
  pull6.dispatchEvent(new MouseEvent('click', { bubbles:true }));
  await settle(30);
  const offered = [...d().querySelectorAll('#om-pulllist input[type="checkbox"]')];
  t('with something to offer', offered.length > 0, true);
  offered[0].checked = true;
  d().querySelector('[data-act="omPullApply"]').dispatchEvent(new MouseEvent('click', { bubbles:true }));
  await settle(50);
  const txt = d().querySelector('#om-tktmsg').textContent;
  t('the refusal is quoted rather than swallowed',
    /may not edit the activity log/.test(txt), true);
  t('and it does not tell anybody to try again', /Try again/.test(txt), false);
  t('it says where the permission has to come from',
    /ask an administrator to grant it/.test(txt), true);
  t('and claims nothing was pulled in', /entries pulled in/.test(txt), false);
  window.FAIL_ACT_UPDATE = null;

  log('\nTHE BUTTON ASKS FOR THE PERMISSION IT ACTUALLY NEEDS');
  // It asked for job_cards:edit, which has nothing to do with writing an activity entry.
  t('the gate is activity_log:edit, which is what the write needs',
    /TX\.can\('activity_log','edit'\)\?`<button class="btn ghost sm" data-act="omTktPullHistory"/
      .test(window.__SRC), true);
  t('and not job_cards:edit, which it used to ask for',
    /TX\.can\('job_cards','edit'\)\?`<button class="btn ghost sm" data-act="omTktPullHistory"/
      .test(window.__SRC), false);

  log('\nA TICKET WITH NO JOB CARD HAS NOTHING TO PULL');
  // Not TKT-2026-0005: a job card was attached to it a few sections ago, so it has one by now.
  await backToTkt('TKT-2026-0012');
  t('so it is not offered', !!d().querySelector('[data-act="omTktPullHistory"]'), false);

  return bad;
}

// ── runner: booted by the driver, in its own iframe ─────────────────────────
const IS_RUNNER = /[?&]run=1/.test(location.search);
if (IS_RUNNER) {
  window.addEventListener('message', async (e) => {
    if (!e.data || e.data.kind !== 'run') return;
    window.__SRC = e.data.src;
    let failures;
    let text = '';
    try {
      await boot();
      failures = await suite((line) => { text += line + '\n'; });
    } catch (err) {
      // A module that throws on the way up has not passed anything.
      failures = 1;
      text += 'THREW: ' + err.message + '\n';
    }
    parent.postMessage({ kind: 'done', failures, text }, '*');
  });
  parent.postMessage({ kind: 'ready' }, '*');
}

// ── driver ──────────────────────────────────────────────────────────────────
if (!IS_RUNNER) {
  (async function () {
    const out = document.getElementById('out');
    const log = (s) => { out.textContent += s + '\n'; };
    let problems = 0;

    const src = await fetch('/js/mod-scheduler.js', { cache: 'no-store' })
      .then((r) => r.text()).then((x) => x.replace(/\r\n/g, '\n'));

    /** One run, in its own frame. Returns {failures, text}. */
    const run = (code) => new Promise((resolve) => {
      const f = document.createElement('iframe');
      f.style.cssText = 'width:900px;height:300px;border:0;opacity:.01;position:absolute;left:-9999px;';
      f.src = 'ticket-harness.html?run=1';
      const onMsg = (e) => {
        if (e.source !== f.contentWindow || !e.data) return;
        if (e.data.kind === 'ready') { f.contentWindow.postMessage({ kind:'run', src:code }, '*'); return; }
        if (e.data.kind === 'done') {
          window.removeEventListener('message', onMsg);
          f.remove();
          resolve(e.data);
        }
      };
      window.addEventListener('message', onMsg);
      document.getElementById('stage').appendChild(f);
      // A frame that never answers is a failure, not a hang.
      setTimeout(() => { try { f.remove(); } catch (x) {} resolve({ failures:1, text:'TIMED OUT\n' }); }, 60000);
    });

    log('=== THE REAL mod-scheduler.js ===\n');
    const base = await run(src);
    log(base.text);
    problems += base.failures;
    log(base.failures ? base.failures + ' FAILED' : 'all passed');

    log('\n\n=== MUTATION: every bug put back, one at a time ===\n');
    for (const [name, from, to] of MUTANTS) {
      const n = src.split(from).length - 1;
      if (n !== 1) {
        problems++;
        log('  ??        ' + name + '  (anchor matched ' + n + ' — the mutant never ran)');
        continue;
      }
      const r = await run(src.replace(from, to));
      if (!r.failures) problems++;
      log((r.failures ? '  caught    ' : '  SURVIVED  ') + name);
    }

    log('\n' + (problems ? problems + ' PROBLEM(S)' : 'baseline green, every mutant caught'));
    document.title = problems ? 'ticket harness — FAIL' : 'ticket harness — PASS';
    window.__result = problems ? 'FAIL' : 'PASS';
  })();
}
